{% capture icon_path %}{{ '/assets/img/app-icons' | relative_url }}{% endcapture %}
<link rel="icon" type="image/svg+xml" href="{{ icon_path }}/orange-black.svg">
<link rel="icon" type="image/png" sizes="32x32" href="{{ icon_path }}/orange-black-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="{{ icon_path }}/orange-black-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="{{ icon_path }}/orange-black-180.png">
{% if site.pwa.enabled %}
  <link rel="manifest" href="{{ '/assets/img/favicons/site.webmanifest' | relative_url }}?v=orange-1">
{% endif %}
<meta name="apple-mobile-web-app-title" content="{{ site.social.name | escape }}">
<meta name="application-name" content="{{ site.social.name | escape }}">
