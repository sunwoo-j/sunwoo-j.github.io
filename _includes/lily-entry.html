<article class="journal-entry" data-topics="{{ post.categories | join: '|' | escape }}" data-search="{{ post.title | escape }} {{ post.english_title | escape }} {{ post.description | escape }} {{ post.english_description | escape }} {{ post.tags | join: ' ' | escape }}">
  <a href="{{ post.url | relative_url }}" data-href-ko="{{ post.url | relative_url }}" data-href-en="{{ post.translation_url | default: post.url | relative_url }}"><time class="mono" datetime="{{ post.date | date_to_xmlschema }}">{{ post.date | date: '%Y.%m.%d' }}</time><div class="entry-copy"><span class="entry-category mono">{{ post.categories | join: ' / ' }}</span><h3 data-title-ko="{{ post.title | escape }}" data-title-en="{{ post.english_title | default: post.title | escape }}">{{ post.title }}</h3></div><span class="entry-arrow" aria-hidden="true">{% include lily-arrow.html direction='up-right' %}</span></a>
</article>
